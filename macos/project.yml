# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# (run from the macos/ directory). The .xcodeproj is git-ignored and regenerated.

name: Masque

options:
  bundleIdPrefix: stavrop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: NCZ7646BF7
    SWIFT_VERSION: "5.0"
    # Versioning scheme: MAJOR.MINOR (no patch) + a separate build number.
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic

packages:
  BigInt:
    url: https://github.com/attaswift/BigInt.git
    from: "5.3.0"

targets:
  Masque:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BigInt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stavrop.Masque
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Masque.entitlements
        # Menu-bar-only agent app: no Dock icon, no main window.
        LSUIElement: YES

  MasqueTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Masque
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: stavrop.MasqueTests

schemes:
  Masque:
    build:
      targets:
        Masque: all
        MasqueTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MasqueTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
