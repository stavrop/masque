<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Masque app icon: a masquerade (domino) mask on a violet squircle.
       Source of truth — regenerate the asset catalog with tools/make_appicon.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#5B3BE0"/>
      <stop offset="1" stop-color="#2E1470"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD4FF"/>
    </linearGradient>

    <filter id="bodyShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="maskShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A0A4A" flood-opacity="0.45"/>
    </filter>

    <!-- Mask silhouette with the two eye holes punched out -->
    <mask id="eyeholes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path fill="#FFFFFF" d="M512 424
        C 562 380, 644 358, 716 364
        C 786 370, 818 402, 810 450
        C 800 518, 748 598, 662 634
        C 600 660, 546 648, 512 610
        C 478 648, 424 660, 362 634
        C 276 598, 224 518, 214 450
        C 206 402, 238 370, 308 364
        C 380 358, 462 380, 512 424 Z"/>
      <ellipse cx="386" cy="470" rx="72" ry="48" fill="#000000" transform="rotate(-13 386 470)"/>
      <ellipse cx="638" cy="470" rx="72" ry="48" fill="#000000" transform="rotate(13 638 470)"/>
    </mask>
  </defs>

  <!-- Squircle body (macOS icon grid: 824pt body inside a 1024pt canvas) -->
  <g filter="url(#bodyShadow)">
    <rect x="100" y="90" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect x="100" y="90" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>
  </g>

  <!-- The mask, painted through the eye-hole mask -->
  <g filter="url(#maskShadow)">
    <rect x="180" y="330" width="664" height="360" fill="url(#face)" mask="url(#eyeholes)"/>
  </g>
</svg>
